[project]
name = "lucky-num"
version = "0.1.0"
description = "LuckyNum (Денежный номер) — Telegram bot for entertainment-oriented numerology analysis of banknote serial numbers"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "aiogram>=3.13,<4.0",
    "SQLAlchemy>=2.0,<3.0",
    # asyncpg: production database (see README "PostgreSQL (production)").
    "asyncpg>=0.29,<1.0",
    # aiosqlite: local development and the test suite only — SQLite is not
    # the production database (see app/database/session.py for why).
    "aiosqlite>=0.20,<1.0",
    "alembic>=1.13,<2.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "openai>=1.40,<2.0",
    "aiohttp>=3.9,<4.0",
    # Explicit CA bundle for the YooKassa HTTPS client — see
    # app/payments/provider.py:YOOKASSA_SSL_CONTEXT for why this is required
    # rather than relying on the platform's default OpenSSL cert paths.
    "certifi>=2024.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "ruff>=0.6,<1.0",
    "mypy>=1.10,<2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true
exclude = ["tests", "app/database/migrations"]
